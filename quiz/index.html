<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Quiz CCNA · CCNA Révisions</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Quiz interactif de révision Cisco : correction immédiate, suivi du score et rejeu des questions ratées.">
  <meta name="robots" content="noindex,follow">
  <meta name="theme-color" content="#1657c7">
  <link rel="icon" href="/img/routeur.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css?v=mtu81lyf">
  <script>
    window.__ROOT__ = "/";
    (function(){ try { var t = localStorage.getItem("ccna-theme"); if (t) document.documentElement.setAttribute("data-theme", t); } catch(e){} })();
  </script>
</head>
<body>
  <div id="nav-slot"></div>

  <main class="container page">
    <div class="quiz-wrap">

      <div id="loader" class="loader">
        <div class="spinner"></div>
        <p>Chargement des questions…</p>
      </div>

      <div id="error-box" class="card" style="display:none;text-align:center">
        <h1 id="error-title" style="font-size:1.3rem">Erreur de chargement</h1>
        <p id="error-msg" style="color:var(--text-muted)">Impossible de charger les questions.</p>
        <div style="display:flex;gap:10px;justify-content:center;margin-top:8px">
          <button class="btn btn--primary" onclick="location.reload()">Réessayer</button>
          <a class="btn btn--ghost" href="/index.html">Accueil</a>
        </div>
      </div>

      <section id="setup" style="display:none">
        <div class="quiz-head">
          <nav class="breadcrumb" style="margin-bottom:12px" aria-label="Fil d’Ariane">
            <a href="/index.html">Accueil</a> <span class="sep"></span>
            <a id="bc-course-setup" href="#">Parcours</a> <span class="sep"></span>
            <span id="bc-module-setup">Quiz</span>
          </nav>
          <div class="quiz-head__bar">
            <h1 class="quiz-head__title" id="setup-title">Quiz</h1>
            <span class="quiz-head__count" id="setup-count"></span>
          </div>
        </div>

        <div class="modes">
          <button type="button" class="mode-card" id="mode-train">
            <span class="mode-card__ic" id="mode-train-ic"></span>
            <span class="mode-card__body">
              <span class="mode-card__title">Entraînement</span>
              <span class="mode-card__desc" id="mode-train-desc">Toutes les questions, correction immédiate, sans limite de temps.</span>
            </span>
          </button>
          <button type="button" class="mode-card" id="mode-exam" aria-expanded="false" aria-controls="exam-opts">
            <span class="mode-card__ic" id="mode-exam-ic"></span>
            <span class="mode-card__body">
              <span class="mode-card__title">Examen blanc</span>
              <span class="mode-card__desc" id="mode-exam-desc">Questions tirées au sort, chronométré, corrigé à la fin.</span>
            </span>
          </button>
        </div>

        <div class="card exam-opts" id="exam-opts" style="display:none">
          <p class="exam-opts__label" id="exam-opts-legend">Nombre de questions</p>
          <div class="opt-row" id="exam-lengths" role="group" aria-labelledby="exam-opts-legend"></div>
          <p class="exam-opts__meta" id="exam-summary"></p>
          <button class="btn btn--primary" id="btn-start-exam">Démarrer l’examen</button>
        </div>
      </section>

      <section id="quiz" style="display:none">
        <div class="quiz-head">
          <nav class="breadcrumb" style="margin-bottom:12px" aria-label="Fil d’Ariane">
            <a href="/index.html">Accueil</a> <span class="sep"></span>
            <a id="bc-course" href="#">Parcours</a> <span class="sep"></span>
            <span id="bc-module">Quiz</span>
          </nav>
          <div class="quiz-head__bar">
            <h1 class="quiz-head__title" id="quiz-title">Quiz</h1>
            <div class="quiz-head__side">
              <span class="quiz-timer" id="quiz-timer" role="timer" style="display:none"></span>
              <span class="quiz-head__count" id="quiz-count">Question 1</span>
            </div>
          </div>
          <div class="quiz-progress"><div class="quiz-progress__fill" id="quiz-fill"></div></div>
        </div>

        <div class="quiz-stats" id="quiz-stats">
          <div class="qstat qstat--ok" id="qstat-ok"><b id="stat-ok">0</b><span>Réussies</span></div>
          <div class="qstat qstat--ko" id="qstat-ko"><b id="stat-ko">0</b><span>Ratées</span></div>
          <div class="qstat" id="qstat-answered" style="display:none"><b id="stat-answered">0</b><span>Répondues</span></div>
          <div class="qstat"><b id="stat-left">0</b><span>Restantes</span></div>
        </div>

        <article class="qcard fade-in" id="qcard">
          <span class="qtag" id="q-tag"></span>
          <p class="qtext" id="q-text"></p>
          <p class="qhint" id="q-multi" style="display:none"></p>
          <img id="q-image" class="qimg" style="display:none" alt="Illustration de la question">
          <div class="choices" id="q-choices"></div>

          <div id="q-validate" style="display:none;margin-top:18px">
            <button class="btn btn--primary" id="btn-validate">Valider ma réponse</button>
          </div>

          <div class="qfeedback" id="q-feedback" style="display:none">
            <p class="qfeedback__txt" id="feedback-txt"></p>
            <button class="btn btn--primary" id="btn-next">Suivant <span class="kbd">Espace</span></button>
          </div>

          <div class="exam-nav" id="exam-nav" style="display:none">
            <button class="btn btn--primary" id="btn-exam-next">Question suivante <span class="kbd">Entrée</span></button>
            <span class="qhint" id="exam-nav-hint">Aucune correction avant la fin de l’examen.</span>
          </div>
        </article>
      </section>

      <section id="recap" style="display:none">
        <div class="recap__score fade-in">
          <div class="ring" id="score-ring"><span class="ring__val" id="ring-val">0<small>%</small></span></div>
          <p class="recap__msg" id="recap-msg"></p>
          <p class="recap__sub" id="recap-sub"></p>
          <div class="recap__actions">
            <button class="btn btn--primary" id="btn-restart">Recommencer</button>
            <button class="btn btn--ghost" id="btn-retry-wrong" style="display:none">Rejouer les erreurs</button>
            <button class="btn btn--ghost" id="btn-change-mode">Changer de mode</button>
            <a class="btn btn--subtle" id="btn-back" href="/index.html">Retour au parcours</a>
          </div>
        </div>
        <div class="mistakes" id="mistakes"></div>
      </section>

    </div>
  </main>

  <div id="footer-slot"></div>

  <script src="/js/curriculum.js?v=mtu81lyf"></script>
  <script src="/js/icons.js?v=mtu81lyf"></script>
  <script src="/js/app.js?v=mtu81lyf"></script>
  <script src="/script/quiz.js?v=mtu81lyf"></script>
</body>
</html>
